<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapLibre GL 3D — Template Acuan Proyek (3D Terrain & DEM)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #090d16; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header {
      background: #0f172a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }
    header h1 { font-size: 16px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    header p { font-size: 12px; color: #94a3b8; }
    .badge-3d { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }

    #map-wrapper { position: relative; flex: 1; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }

    .control-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 14px 16px;
      border-radius: 10px;
      z-index: 20;
      width: 280px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .panel-title { font-size: 11px; font-weight: 700; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    
    .control-group { margin-bottom: 12px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; font-weight: 500; }
    .control-group input[type="range"] { width: 100%; accent-color: #0284c7; cursor: pointer; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover { background: #334155; color: #fff; }
    .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .btn-full { grid-column: span 2; }
    .btn-glow { background: linear-gradient(135deg, #0369a1, #4338ca); color: #fff; border: none; }
    .btn-glow:hover { opacity: 0.95; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Template Acuan Peta 3D <span class="badge-3d">3D Terrain DEM</span></h1>
      <p>Elevasi Kontur Topografi Nyata + Pitch Kamera Miring + Animasi Rotasi 360°</p>
    </div>
  </header>

  <div id="map-wrapper">
    <div id="map"></div>

    <div class="control-panel">
      <div class="panel-title">Kontrol Kamera & Elevasi 3D</div>

      <div class="control-group">
        <label>
          <span>Kemiringan (Pitch)</span>
          <span id="pitch-val">65°</span>
        </label>
        <input type="range" id="pitch-slider" min="0" max="80" value="65" oninput="updatePitch(this.value)">
      </div>

      <div class="control-group">
        <label>
          <span>Eksagerasi Topografi 3D</span>
          <span id="exag-val">1.8x</span>
        </label>
        <input type="range" id="exag-slider" min="5" max="35" value="18" oninput="updateExaggeration(this.value / 10)">
      </div>

      <div class="btn-grid">
        <button id="btn-mode-3d" class="btn active" onclick="set3DMode(true)">Mode 3D</button>
        <button id="btn-mode-2d" class="btn" onclick="set3DMode(false)">Mode 2D Datar</button>
        <button id="btn-rotate" class="btn btn-full btn-glow" onclick="toggleAutoRotate()">Mulai Rotasi Kamera 3D</button>
        <button class="btn btn-full" onclick="resetCamera()">Reset Fokus Wilayah</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.js"></script>
  <script>
    let isRotating = false;
    let rotationReq = null;
    let currentExaggeration = 1.8;

    // Inisialisasi MapLibre 3D dengan Demotiles MapLibre / OpenFreeMap
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [109.685, -7.339],
      zoom: 12.8,
      pitch: 65,      // Kemiringan kamera 3D
      bearing: -20,    // Rotasi sudut pandang
      maxPitch: 85,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-left");

    map.on("load", () => {
      // 1. Tambahkan Sumber Terrain DEM (Digital Elevation Model)
      // Menggunakan tile elevasi gratis global Terrarium / MapLibre DEM
      map.addSource("terrain-dem", {
        type: "raster-dem",
        tiles: [
          "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
        ],
        tileSize: 256,
        encoding: "terrarium",
        maxzoom: 15
      });

      // Aktifkan Topografi 3D Nyata di Peta
      map.setTerrain({
        source: "terrain-dem",
        exaggeration: currentExaggeration
      });

      // 2. Tambahkan Efek Atmosfer Langit 3D (Sky & Fog)
      map.setSky({
        "sky-color": "#1e3a8a",
        "horizon-color": "#93c5fd",
        "fog-color": "#cbd5e1",
        "fog-ground-blend": 0.4
      });

      // 3. Muat Batas Wilayah GeoJSON 2D di atas medan 3D
      Promise.all([
        fetch("../assets/peta_kecamatan.geojson").then(r => r.json()),
        fetch("../assets/peta_desa.geojson").then(r => r.json())
      ]).then(([kec, desa]) => {
        // Garis batas kecamatan
        map.addSource("kec-3d-source", { type: "geojson", data: kec });
        map.addLayer({
          id: "kec-3d-line",
          type: "line",
          source: "kec-3d-source",
          paint: {
            "line-color": "#38bdf8",
            "line-width": 3,
            "line-dasharray": [4, 2]
          }
        });

        // Poligon desa semi-transparan yang memeluk kontur gunung/lembah
        map.addSource("desa-3d-source", { type: "geojson", data: desa });
        map.addLayer({
          id: "desa-3d-fill",
          type: "fill",
          source: "desa-3d-source",
          paint: {
            "fill-color": "#6366f1",
            "fill-opacity": 0.35
          }
        });
        map.addLayer({
          id: "desa-3d-stroke",
          type: "line",
          source: "desa-3d-source",
          paint: {
            "line-color": "#ffffff",
            "line-width": 1.5
          }
        });
      }).catch(err => console.error("Gagal memuat GeoJSON 3D:", err));
    });

    // Kontrol Kemiringan (Pitch)
    function updatePitch(val) {
      document.getElementById("pitch-val").innerText = val + "°";
      map.setPitch(parseFloat(val));
    }

    // Kontrol Eksagerasi Topografi (Tinggi Gunung & Lembah)
    function updateExaggeration(val) {
      currentExaggeration = val;
      document.getElementById("exag-val").innerText = val.toFixed(1) + "x";
      if (map.getSource("terrain-dem")) {
        map.setTerrain({ source: "terrain-dem", exaggeration: val });
      }
    }

    // Toggle 2D vs 3D
    function set3DMode(is3D) {
      document.getElementById("btn-mode-3d").classList.toggle("active", is3D);
      document.getElementById("btn-mode-2d").classList.toggle("active", !is3D);
      
      if (is3D) {
        map.easeTo({ pitch: 65, duration: 1000 });
        if (map.getSource("terrain-dem")) {
          map.setTerrain({ source: "terrain-dem", exaggeration: currentExaggeration });
        }
        document.getElementById("pitch-slider").value = 65;
        document.getElementById("pitch-val").innerText = "65°";
      } else {
        map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
        map.setTerrain(null); // Matikan terrain untuk tampilan 2D datar murni
        document.getElementById("pitch-slider").value = 0;
        document.getElementById("pitch-val").innerText = "0°";
      }
    }

    // Animasi Fly-Around 360 Derajat
    function rotateCamera() {
      if (!isRotating) return;
      map.rotateTo((map.getBearing() + 0.25) % 360, { duration: 0 });
      rotationReq = requestAnimationFrame(rotateCamera);
    }

    function toggleAutoRotate() {
      isRotating = !isRotating;
      const btn = document.getElementById("btn-rotate");
      if (isRotating) {
        btn.innerText = "Hentikan Rotasi 3D";
        btn.style.background = "#dc2626";
        rotateCamera();
      } else {
        btn.innerText = "Mulai Rotasi Kamera 3D";
        btn.style.background = "";
        if (rotationReq) cancelAnimationFrame(rotationReq);
      }
    }

    function resetCamera() {
      map.flyTo({
        center: [109.685, -7.339],
        zoom: 12.8,
        pitch: 65,
        bearing: -20,
        duration: 1500
      });
    }
  </script>
</body>
</html>
