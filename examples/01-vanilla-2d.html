<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta 2D Banjarnegara — MapLibre GL JS (Liberty, Positron, Bright, Dark & Satelit)</title>
  
  <!-- Font Google: Outfit (Heading) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="../assets/maplibre-gl.css">
  
  <style>
    :root {
      --vibe-bg: #090d16;
      --vibe-surface: rgba(15, 23, 42, 0.92);
      --vibe-border: rgba(56, 189, 248, 0.22);
      --vibe-border-hover: rgba(56, 189, 248, 0.45);
      --vibe-text-main: #f8fafc;
      --vibe-text-sub: #94a3b8;
      --vibe-accent: #0284c7;
      --vibe-accent-hover: #0369a1;
      --vibe-font-head: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --vibe-font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vibe-font-body);
      background: var(--vibe-bg);
      color: var(--vibe-text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: #0f172a;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 20;
    }
    .brand-title {
      font-family: var(--vibe-font-head);
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--vibe-text-sub);
      margin-top: 2px;
    }
    .badge-scope {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* Map Viewport Area */
    #map-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Search Bar Overlay (Top Left) */
    .search-box-container {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 25;
      width: 300px;
      max-width: calc(100vw - 32px);
    }
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      background: var(--vibe-surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--vibe-border);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-family: var(--vibe-font-body);
      outline: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: var(--radius-md);
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 10px 24px rgba(0,0,0,0.5);
      display: none;
    }
    .search-item {
      padding: 9px 12px;
      font-size: 12px;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover {
      background: #1e293b;
      color: #38bdf8;
    }
    .search-item-sub {
      font-size: 11px;
      color: var(--vibe-text-sub);
    }

    /* Floating Control Panel (Top-Right) */
    .control-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--vibe-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--vibe-border);
      padding: 16px;
      border-radius: var(--radius-md);
      z-index: 15;
      width: 320px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .panel-section-title {
      font-family: var(--vibe-font-head);
      font-size: 11px;
      font-weight: 700;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    /* Layer Switcher Button Group (5 Styles) */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }
    .btn-group-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }
    .btn-layer {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 4px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-align: center;
    }
    .btn-layer:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--vibe-border-hover);
    }
    .btn-layer.active {
      background: var(--vibe-accent);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
    }

    /* Filter & Controls */
    .filter-group {
      margin-bottom: 12px;
    }
    .select-input {
      width: 100%;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: var(--vibe-font-body);
      outline: none;
      cursor: pointer;
    }
    .select-input:focus {
      border-color: #38bdf8;
    }

    /* Layer Visibility Checkboxes */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .toggle-row input[type="checkbox"] {
      accent-color: var(--vibe-accent);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .btn-grid-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-action {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-action:hover {
      background: #334155;
      color: #ffffff;
    }

    /* Bottom Info Card */
    .info-card {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--vibe-surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--vibe-border);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      z-index: 15;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .info-card-title {
      font-family: var(--vibe-font-head);
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .info-card-text {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* MapLibre Popup Customization */
    .maplibregl-popup-content {
      background: #0f172a !important;
      color: #f8fafc !important;
      border-radius: var(--radius-md) !important;
      padding: 12px 16px !important;
      border: 1px solid rgba(56, 189, 248, 0.3) !important;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: #0f172a !important;
    }
    .popup-title {
      font-family: var(--vibe-font-head);
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .popup-meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .popup-badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(2, 132, 199, 0.25);
      color: #7dd3fc;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      header { padding: 10px 14px; flex-direction: column; align-items: flex-start; gap: 4px; }
      .search-box-container { top: 10px; left: 10px; width: calc(100vw - 20px); }
      .control-panel { top: 62px; right: 10px; width: calc(100vw - 20px); padding: 12px; }
      .info-card { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title">
        Peta 2D Kabupaten Banjarnegara
      </div>
      <div class="brand-subtitle">Visualisasi Layer Batas Spasial Baku: 20 Kecamatan & 278 Desa</div>
    </div>
    <span class="badge-scope">GeoLibre Starter Kit</span>
  </header>

  <div id="map-wrapper">
    <!-- Autocomplete Search Bar -->
    <div class="search-box-container">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Cari desa atau kecamatan..." 
          autocomplete="off"
          oninput="onSearchInput(this.value)"
        />
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <div id="map"></div>

    <!-- Floating Control Panel -->
    <div class="control-panel">
      <div class="panel-section-title">Gaya Peta Dasar (5 Basemap)</div>
      <div class="btn-group">
        <button id="btn-liberty" class="btn-layer active" onclick="setBasemap('liberty')">Liberty</button>
        <button id="btn-positron" class="btn-layer" onclick="setBasemap('positron')">Positron</button>
        <button id="btn-bright" class="btn-layer" onclick="setBasemap('bright')">Bright</button>
      </div>
      <div class="btn-group-2">
        <button id="btn-dark" class="btn-layer" onclick="setBasemap('dark')">Dark (OFM)</button>
        <button id="btn-satelit" class="btn-layer" onclick="setBasemap('satelit')">Satelit Esri</button>
      </div>

      <div class="panel-section-title">Filter Kecamatan</div>
      <div class="filter-group">
        <select id="select-kecamatan" class="select-input" onchange="onKecamatanFilter(this.value)">
          <option value="">Semua Kecamatan (20 Wilayah)</option>
        </select>
      </div>

      <div class="panel-section-title">Visibilitas Layer</div>
      <div class="toggle-row">
        <label for="toggle-kecamatan">Batas Garis Kecamatan</label>
        <input type="checkbox" id="toggle-kecamatan" checked onchange="toggleLayerVisibility('layer-kec-line', this.checked)">
      </div>
      <div class="toggle-row">
        <label for="toggle-desa">Poligon Wilayah Desa</label>
        <input type="checkbox" id="toggle-desa" checked onchange="toggleLayerVisibility('layer-desa-fill', this.checked)">
      </div>

      <div class="btn-grid-actions">
        <button id="btn-reset-view" class="btn-action" onclick="resetBanjarnegaraBounds()">Reset Peta</button>
        <button id="btn-toggle-pitch" class="btn-action" onclick="togglePerspectivePitch()">Tilt 3D (60°)</button>
      </div>
    </div>

    <!-- Info Card -->
    <div id="info-card" class="info-card">
      <div class="info-card-title">Informasi Wilayah</div>
      <div id="info-content" class="info-card-text">
        Ketik nama desa di bilah pencarian atau klik pada peta untuk melihat detail atribut desa/kecamatan.
      </div>
    </div>
  </div>

  <!-- MapLibre GL JS Local UMD Bundle (Mandiri & Bebas Dependency Eksternal) -->
  <script src="../assets/maplibre-gl.js"></script>
  <!-- Konfigurasi Peta Banjarnegara -->
  <script src="../assets/map-config.js"></script>
  <!-- Data Spasial Baku (Mendukung Protokol file:// & http://) -->
  <script src="../assets/geojson/banjarnegara-data.js"></script>

  <script>
    const CONFIG = window.BANJARNEGARA_MAP;

    let activeStyleKey = "liberty";
    let kecGeoJson = null;
    let desaGeoJson = null;
    let selectedKecamatan = "";
    let isPitched = false;

    // Inisialisasi Instance Peta
    const map = new maplibregl.Map({
      container: "map",
      style: CONFIG.styles.liberty,
      center: CONFIG.center,
      zoom: CONFIG.zoom,
      maxPitch: 85,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl(), "top-left");

    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false,
      offset: 12
    });

    // Inisialisasi Lapisan GeoJSON saat Style dimuat
    function applyGeoJsonLayers() {
      if (!map.isStyleLoaded() || !desaGeoJson || !kecGeoJson) return;

      // 1. Sumber Data Desa Baku
      if (!map.getSource("source-desa")) {
        map.addSource("source-desa", {
          type: "geojson",
          data: desaGeoJson
        });

        map.addLayer({
          id: "layer-desa-fill",
          type: "fill",
          source: "source-desa",
          paint: {
            "fill-color": ["get", "_color"],
            "fill-opacity": [
              "case",
              ["boolean", ["feature-state", "hover"], false],
              0.82,
              0.4
            ]
          }
        });

        map.addLayer({
          id: "layer-desa-line",
          type: "line",
          source: "source-desa",
          paint: {
            "line-color": "#ffffff",
            "line-width": 0.8,
            "line-opacity": 0.55
          }
        });
      }

      // 2. Sumber Data Kecamatan Baku
      if (!map.getSource("source-kec")) {
        map.addSource("source-kec", {
          type: "geojson",
          data: kecGeoJson
        });

        map.addLayer({
          id: "layer-kec-line",
          type: "line",
          source: "source-kec",
          paint: {
            "line-color": "#0284c7",
            "line-width": 2.4,
            "line-dasharray": [3, 2]
          }
        });
      }

      if (selectedKecamatan) {
        applyFilter(selectedKecamatan);
      }
    }

    // Pasang listener pada event load dan idle agar batas wilayah otomatis terpasang kembali saat ganti basemap
    map.on("load", applyGeoJsonLayers);
    map.on("idle", applyGeoJsonLayers);

    // Event Interaksi Hover Desa (dipasang satu kali di map instance)
    map.on("mousemove", "layer-desa-fill", (e) => {
      if (!e.features.length) return;
      map.getCanvas().style.cursor = "pointer";
      const feat = e.features[0];
      const props = feat.properties || {};

      const namaDesa = props.Nama_Desa_ || props.Name || "Desa";
      const kec = props.Kecamatan || "-";
      const kab = props.Kabupaten || "Banjarnegara";
      const objId = props.OBJECTID || "-";

      popup.setLngLat(e.lngLat)
        .setHTML(`
          <div class="popup-title">${namaDesa}</div>
          <div class="popup-meta">
            Kecamatan: <strong>${kec}</strong><br>
            Kabupaten: ${kab}
          </div>
          <span class="popup-badge">ID: ${objId}</span>
        `)
        .addTo(map);

      document.getElementById("info-content").innerHTML = `
        <strong>${namaDesa}</strong> (${kec})<br>
        <span style="color:#94a3b8;font-size:11px;">Kabupaten ${kab} &bull; OBJECTID: ${objId}</span>
      `;
    });

    map.on("mouseleave", "layer-desa-fill", () => {
      map.getCanvas().style.cursor = "";
      popup.remove();
    });

    // Ambil Data GeoJSON Baku (prioritaskan data instan dari window.BANJARNEGARA_GEOJSON agar jalan di file://)
    const loadDataPromise = (window.BANJARNEGARA_GEOJSON && window.BANJARNEGARA_GEOJSON.kecamatan)
      ? Promise.resolve([window.BANJARNEGARA_GEOJSON.kecamatan, window.BANJARNEGARA_GEOJSON.desa])
      : Promise.all([
          fetch(CONFIG.paths.kecamatan).then(r => r.json()),
          fetch(CONFIG.paths.desa).then(r => r.json())
        ]);

    loadDataPromise.then(([kecData, desaData]) => {
      kecGeoJson = kecData;

      const kecMap = {};
      let colorIndex = 0;

      desaData.features.forEach((f, idx) => {
        f.id = idx + 1;
        const props = f.properties || {};
        const kecName = (props.Kecamatan || "").toLowerCase();
        if (kecMap[kecName] === undefined) {
          kecMap[kecName] = CONFIG.colors[colorIndex % CONFIG.colors.length];
          colorIndex++;
        }
        props._color = kecMap[kecName];
      });

      desaGeoJson = desaData;

      // Populate Dropdown Kecamatan
      const selectEl = document.getElementById("select-kecamatan");
      const listKec = [];
      kecData.features.forEach(f => {
        const name = f.properties.Kecamatan || f.properties.Name;
        if (name && !listKec.includes(name)) listKec.push(name);
      });
      listKec.sort().forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = "Kecamatan " + k.charAt(0).toUpperCase() + k.slice(1);
        selectEl.appendChild(opt);
      });

      // Terapkan layer spasial seketika
      applyGeoJsonLayers();
    }).catch(err => console.error("Gagal memuat berkas GeoJSON baku:", err));

    // Ganti Basemap (Liberty, Positron, Bright, Dark, Satelit)
    function setBasemap(styleKey) {
      if (activeStyleKey === styleKey) return;
      document.querySelectorAll(".btn-layer").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("btn-" + styleKey);
      if (btn) btn.classList.add("active");
      activeStyleKey = styleKey;
      map.setStyle(CONFIG.styles[styleKey]);
    }

    // Filter Interaktif per-Kecamatan
    function onKecamatanFilter(kecValue) {
      selectedKecamatan = kecValue;
      applyFilter(kecValue);

      if (!kecValue) {
        resetBanjarnegaraBounds();
        return;
      }

      if (kecGeoJson && kecGeoJson.features) {
        const feat = kecGeoJson.features.find(f => {
          const val = (f.properties.Kecamatan || f.properties.Name || "").toLowerCase();
          return val === kecValue.toLowerCase();
        });

        if (feat && feat.geometry) {
          fitFeatureBounds(feat.geometry.coordinates);
        }
      }
    }

    function applyFilter(kecValue) {
      if (!map.getLayer("layer-desa-fill")) return;
      if (!kecValue) {
        map.setFilter("layer-desa-fill", null);
        map.setFilter("layer-desa-line", null);
      } else {
        const filterExpr = [
          "any",
          ["==", ["downcase", ["get", "Kecamatan"]], kecValue.toLowerCase()],
          ["==", ["downcase", ["get", "Kecamatan"]], ("kec." + kecValue).toLowerCase()],
          ["==", ["downcase", ["get", "Kecamatan"]], ("kecamatan " + kecValue).toLowerCase()],
          ["==", ["downcase", ["get", "Name"]], kecValue.toLowerCase()]
        ];
        map.setFilter("layer-desa-fill", filterExpr);
        map.setFilter("layer-desa-line", filterExpr);
      }
    }

    // Autocomplete Search Desa & Kecamatan
    function onSearchInput(val) {
      const resultsEl = document.getElementById("search-results");
      if (!val || !val.trim() || !desaGeoJson) {
        resultsEl.style.display = "none";
        resultsEl.innerHTML = "";
        return;
      }

      const matches = CONFIG.searchFeatures(val, desaGeoJson.features, 7);
      if (!matches.length) {
        resultsEl.innerHTML = '<div class="search-item" style="cursor:default;color:#94a3b8;">Desa tidak ditemukan</div>';
        resultsEl.style.display = "block";
        return;
      }

      resultsEl.innerHTML = matches.map((f, i) => {
        const p = f.properties || {};
        const nama = p.Nama_Desa_ || p.Name;
        const kec = p.Kecamatan || "";
        return `
          <div class="search-item" onclick="selectSearchedFeature(${i})">
            <div>${nama}</div>
            <div class="search-item-sub">${kec} &bull; Banjarnegara</div>
          </div>
        `;
      }).join("");
      resultsEl.style.display = "block";
      window._currentSearchMatches = matches;
    }

    function selectSearchedFeature(index) {
      const feat = window._currentSearchMatches?.[index];
      if (!feat || !feat.geometry) return;

      document.getElementById("search-results").style.display = "none";
      document.getElementById("search-input").value = feat.properties.Nama_Desa_ || feat.properties.Name;

      fitFeatureBounds(feat.geometry.coordinates);

      // Tampilkan popup
      const center = calculateFeatureCenter(feat.geometry.coordinates);
      if (center) {
        popup.setLngLat(center)
          .setHTML(`
            <div class="popup-title">${feat.properties.Nama_Desa_}</div>
            <div class="popup-meta">Kecamatan: <strong>${feat.properties.Kecamatan}</strong></div>
            <span class="popup-badge">ID: ${feat.properties.OBJECTID}</span>
          `)
          .addTo(map);
      }
    }

    function fitFeatureBounds(coordinates) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      function scan(c) {
        if (typeof c[0] === "number") {
          if (c[0] < minX) minX = c[0];
          if (c[0] > maxX) maxX = c[0];
          if (c[1] < minY) minY = c[1];
          if (c[1] > maxY) maxY = c[1];
        } else {
          c.forEach(scan);
        }
      }
      scan(coordinates);
      if (minX !== Infinity) {
        map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 50, duration: 900 });
      }
    }

    function calculateFeatureCenter(coordinates) {
      let sumX = 0, sumY = 0, count = 0;
      function scan(c) {
        if (typeof c[0] === "number") {
          sumX += c[0];
          sumY += c[1];
          count++;
        } else {
          c.forEach(scan);
        }
      }
      scan(coordinates);
      return count > 0 ? [sumX / count, sumY / count] : null;
    }

    // Toggle Visibilitas Layer
    function toggleLayerVisibility(layerId, isVisible) {
      if (map.getLayer(layerId)) {
        map.setLayoutProperty(layerId, "visibility", isVisible ? "visible" : "none");
      }
    }

    // Toggle Kemiringan Perspektif 3D
    function togglePerspectivePitch() {
      isPitched = !isPitched;
      const btn = document.getElementById("btn-toggle-pitch");
      if (isPitched) {
        map.easeTo({ pitch: 60, bearing: -15, duration: 900 });
        btn.textContent = "Datar 2D (0°)";
        btn.style.borderColor = "#38bdf8";
        btn.style.color = "#38bdf8";
      } else {
        map.easeTo({ pitch: 0, bearing: 0, duration: 900 });
        btn.textContent = "Tilt 3D (60°)";
        btn.style.borderColor = "#334155";
        btn.style.color = "#e2e8f0";
      }
    }

    // Reset View Bounds ke Seluruh Banjarnegara
    function resetBanjarnegaraBounds() {
      map.fitBounds(CONFIG.bounds, { padding: 25, duration: 800 });
      document.getElementById("select-kecamatan").value = "";
      document.getElementById("search-input").value = "";
      document.getElementById("search-results").style.display = "none";
      selectedKecamatan = "";
      applyFilter("");
      popup.remove();
    }
  </script>
</body>
</html>
